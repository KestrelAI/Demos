{{- if .Values.fragmenter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mig-fragmentation-demo.fullname" . }}-fragmenter
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mig-fragmentation-demo.labels" . | nindent 4 }}
    app: mig-fragmenter
spec:
  replicas: {{ .Values.fragmenter.replicas }}
  selector:
    matchLabels:
      app: mig-fragmenter
      {{- include "mig-fragmentation-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: mig-fragmenter
        workload-type: fragmenter
        priority: low
        {{- include "mig-fragmentation-demo.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "mig-fragmentation-demo.serviceAccountName" . }}
      {{- end }}
      
      # Spread fragmenter pods to different nodes than inference
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: mig-fragmenter
              topologyKey: "kubernetes.io/hostname"
      
      {{- include "mig-fragmentation-demo.nodeSelector" . | nindent 6 }}
      {{- include "mig-fragmentation-demo.tolerations" . | nindent 6 }}
      
      {{- if .Values.priorityClasses.enabled }}
      priorityClassName: {{ .Values.priorityClasses.inference.name }}
      {{- end }}
      
      containers:
      - name: fragmenter
        image: {{ .Values.fragmenter.image }}
        imagePullPolicy: {{ .Values.fragmenter.imagePullPolicy }}
        command:
        {{- range .Values.fragmenter.command }}
        - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            {{- toYaml .Values.fragmenter.resources.requests | nindent 12 }}
          limits:
            {{- toYaml .Values.fragmenter.resources.limits | nindent 12 }}
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
{{- end }}
